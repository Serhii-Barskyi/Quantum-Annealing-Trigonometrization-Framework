# Pegasus QPU handoff overrides.
#
# Load after:
#   config/base.yaml
#   config/case300.yaml
#
# Safe default:
#   enabled: false
#   dry_run: true
#
# Before a real submission:
#   1. set enabled: true
#   2. set solver_id explicitly to Advantage_system4.* or Advantage_system6.*
#   3. complete dry-run validation
#   4. then set dry_run: false
#
# No automatic solver selection and no topology fallback are permitted.

project:
  root: /content/drive/MyDrive/cssf_dwave
  execution_environment: google_colab
  strict_no_fallbacks: true
  quantum_walk_enabled: false

runtime:
  require_gpu: true
  require_cuda: true
  statevector_provider: qiskit_aer_gpu
  aer_method: statevector
  aer_device: GPU
  fail_if_gpu_unavailable: true
  install_from: /content/drive/MyDrive/cssf_dwave/requirements-colab.txt

qpu:
  enabled: false
  backend: pegasus_qpu
  topology_type: pegasus
  allowed_solver_prefixes:
    - Advantage_system4.
    - Advantage_system6.
  solver_id: null
  require_explicit_solver_id: true
  reject_zephyr: true
  allow_solver_fallback: false
  dry_run: true
  num_reads: 4096
  annealing_time: 20.0

emulator:
  backend: local_sqa_gpu
  num_reads: 8192
  return_dimod_sampleset: true
  topology_type: pegasus
  pegasus_m: 16
  require_gpu: true
  allow_classical_fallback: false
  sqa_trotter_replicas: 96
  sqa_sweeps: 4000
  sqa_burn_in_sweeps: 1000
